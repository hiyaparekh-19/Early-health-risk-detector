{% extends "base.html" %}

{% block content %}

<div class="main-container">

<div class="card register-card shadow-lg">

<div class="header">
    <h2>HealthPulse</h2>
    <p>Create your wellness account</p>
</div>

<form method="POST" onkeypress="if(event.key==='Enter') this.submit();">

<!-- NAME -->
<div class="field-group">
    <div class="input-group">
        <i class="fa fa-user left-icon"></i>
        <input name="name" required autofocus>
        <label>Full Name</label>
    </div>
    <small id="name-msg" class="msg"></small>
</div>

<!-- EMAIL -->
<div class="field-group">
    <div class="input-group">
        <i class="fa fa-envelope left-icon"></i>
        <input id="email" name="email" type="email" required>
        <label>Email</label>
    </div>
    <small id="email-msg" class="msg"></small>
</div>

<!-- PASSWORD -->
<div class="field-group">
    <div class="input-group password-group">
        <i class="fa fa-lock left-icon"></i>
        <input id="password" name="password" type="password" required>
        <label>Password</label>
        <i id="eyeIcon" class="fa fa-eye right-icon" onclick="togglePassword()"></i>
    </div>
    <small id="password-msg" class="msg"></small>
</div>

<div class="terms-box">
    <input type="checkbox" id="terms">
    <label for="terms">
        I agree to the 
        <a href="/terms" target="_blank">Terms & Conditions</a>
    </label>
</div>

<button id="registerBtn" disabled class="btn-register">
    Register
</button>

</form>

{% if error %}
<div class="error-box">
    {{ error }}
</div>
{% endif %}

<div class="bottom-text">
Already have an account?
<a href="{{ url_for('login') }}">Login</a>
</div>

</div>
</div>

<!-- 🔥 STYLES -->
<style>

.main-container{
min-height:90vh;
display:flex;
align-items:center;
justify-content:center;
background: linear-gradient(135deg,#f5f7ff,#eef1ff);
}

.register-card{
max-width:420px;
width:100%;
border-radius:20px;
padding:35px;
border:none;
animation: fadeIn 0.6s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

.header{
text-align:center;
margin-bottom:25px;
}

.header h2{
color:#6c63ff;
font-weight:700;
}

.header p{
color:#666;
}

/* FIELD GROUP */
.field-group{
margin-bottom:18px;
}

/* INPUT GROUP */
.input-group{
position:relative;
cursor:text;
}

.input-group input{
width:100%;
padding:12px 40px;
border-radius:10px;
border:1px solid #ddd;
outline:none;
transition:0.3s;
box-sizing:border-box;
}

.input-group input:focus{
border-color:#6c63ff;
box-shadow:0 0 0 3px rgba(108,99,255,0.1);
}

.input-group label{
position:absolute;
left:40px;
top:50%;
transform:translateY(-50%);
color:#999;
transition:0.3s;
background:white;
padding:0 5px;
pointer-events:none;
}

.input-group input:focus + label,
.input-group input:valid + label{
top:-8px;
font-size:12px;
color:#6c63ff;
}

/* ICONS */
.left-icon{
position:absolute;
left:12px;
top:50%;
transform:translateY(-50%);
color:#999;
}

.right-icon{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
color:#999;
}

/* BUTTON */
.btn-register{
width:100%;
background:linear-gradient(135deg,#6c63ff,#7c73ff);
color:white;
border:none;
border-radius:10px;
padding:12px;
font-weight:600;
opacity:0.6;
cursor:not-allowed;
transition:0.3s;
}

.btn-register.enabled{
opacity:1;
cursor:pointer;
}

.btn-register.enabled:hover{
transform:scale(1.02);
}

/* MESSAGE */
.msg{
display:block;
font-size:13px;
margin-top:6px;
min-height:18px;
}

/* ERROR BOX */
.error-box{
margin-top:15px;
background:#fff1f0;
border:1px solid #ffa39e;
color:#ff4d4f;
padding:10px;
border-radius:10px;
text-align:center;
}

/* FOOTER */
.bottom-text{
text-align:center;
margin-top:20px;
}

.bottom-text a{
color:#6c63ff;
font-weight:600;
text-decoration:none;
}

.terms-box{
display:flex;
align-items:center;
gap:8px;
font-size:14px;
margin-top:5px;
margin-bottom:10px;
}

.terms-box input{
cursor:pointer;
}

.terms-box a{
color:#6c63ff;
text-decoration:none;
font-weight:500;
}

.terms-box a:hover{
text-decoration:underline;
}

</style>

<!-- 🔥 SCRIPT -->
<script>

// PASSWORD TOGGLE
function togglePassword(){
const pwd = document.getElementById("password");
const icon = document.getElementById("eyeIcon");

if(pwd.type === "password"){
    pwd.type = "text";
    icon.classList.replace("fa-eye","fa-eye-slash");
}else{
    pwd.type = "password";
    icon.classList.replace("fa-eye-slash","fa-eye");
}
}

// FLAGS
let isNameValid = false;
let isEmailValid = false;
let isPasswordValid = false;
let isTermsChecked = false;

const registerBtn = document.getElementById("registerBtn");

// BUTTON CONTROL
function updateButton(){
if(isNameValid && isEmailValid && isPasswordValid && isTermsChecked){
    registerBtn.disabled = false;
    registerBtn.classList.add("enabled");
}else{
    registerBtn.disabled = true;
    registerBtn.classList.remove("enabled");
}
}

// NAME VALIDATION
const nameInput = document.querySelector('[name="name"]');
const nameMsg = document.getElementById("name-msg");

nameInput.addEventListener("input", function() {
    let value = nameInput.value;

    // 🔥 Convert to Proper Case
    value = value.toLowerCase().replace(/\b\w/g, char => char.toUpperCase());
    nameInput.value = value;

    if(value.trim() === ""){
        nameMsg.innerText = "";
        isNameValid = false;
        return updateButton();
    }

    const valid = /^[A-Za-z ]+$/.test(value);

    if(valid){
        nameMsg.innerText = "Valid name ✔";
        nameMsg.style.color = "green";
        nameInput.style.borderColor = "#28a745";
        isNameValid = true;
    }else{
        nameMsg.innerText = "Only alphabets and spaces allowed";
        nameMsg.style.color = "#ff4d4f";
        nameInput.style.borderColor = "#ff4d4f";
        isNameValid = false;
    }

    updateButton();
});

// EMAIL VALIDATION
const allowedDomains = ["gmail.com","yahoo.in","hotmail.com","outlook.com","nmims.edu","nmims.in"];
const emailInput = document.getElementById("email");
const emailMsg = document.getElementById("email-msg");

emailInput.addEventListener("input", function(){
let value = emailInput.value.trim().toLowerCase(); // 🔥 force lowercase
emailInput.value = value;

if(value === ""){
    emailMsg.innerText = "";
    isEmailValid = false;
    return updateButton();
}

const parts = value.split("@");

if(parts.length < 2){
    emailMsg.innerText = "";
    isEmailValid = false;
    return updateButton();
}

const valid = allowedDomains.includes(parts[1].toLowerCase());

emailMsg.innerText = valid ? "Valid email ✔" : "Please use Gmail, Yahoo, Outlook or NMIMS email";
emailMsg.style.color = valid ? "green" : "#ff4d4f";

isEmailValid = valid;
updateButton();
});

// PASSWORD VALIDATION
const passwordInput = document.getElementById("password");
const passwordMsg = document.getElementById("password-msg");

passwordInput.addEventListener("input", function(){
const value = passwordInput.value;

if(value === ""){
    passwordMsg.innerText = "";
    isPasswordValid = false;
    return updateButton();
}

const valid = /^(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/.test(value);

passwordMsg.innerText = valid ? "Strong password ✔" : "Min 8 chars, 1 uppercase, 1 number, 1 special char";
passwordMsg.style.color = valid ? "green" : "#ff4d4f";

isPasswordValid = valid;
updateButton();
});

const termsCheckbox = document.getElementById("terms");

termsCheckbox.addEventListener("change", function(){
    isTermsChecked = termsCheckbox.checked;
    updateButton();
});

document.querySelector("form").addEventListener("submit", function(){
    const btn = document.getElementById("registerBtn");
    btn.innerText = "Creating account...";
    btn.style.opacity = "0.7";
});

</script>



<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

{% endblock %}
