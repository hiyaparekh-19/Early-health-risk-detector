<div class="row g-3 mt-2">
  {% for risk in risk_cards %}
    {% set value = risk_values[risk.key] %}
    <div class="col-md-4">
      <button type="button" class="hp-card hp-stat hp-risk-card" data-risk-card aria-expanded="false">
        <div class="hp-risk-card-top">
          <div>
            <div class="hp-stat-label">{{ risk.title }}</div>
            <div class="hp-stat-value">{{ value }}%</div>
          </div>
          <i class="bi bi-chevron-down hp-risk-chevron"></i>
        </div>

        {% if show_risk_level %}
          <div class="hp-stat-sub">
            {% if value > 70 %}High
            {% elif value > 40 %}Moderate
            {% else %}Low{% endif %}
          </div>
        {% endif %}

        <div class="hp-risk-more">
          <div class="hp-risk-section">
            <b>What it means</b>
            <p>{{ risk.definition }}</p>
          </div>
          <div class="hp-risk-section">
            <b>Why your score changes</b>
            <p>{{ risk.signals }}</p>
          </div>
          <div class="hp-risk-section">
            <b>What can help</b>
            <p>{{ risk.tip }}</p>
          </div>
          <div class="hp-risk-close-note">Click again to close this card.</div>
        </div>
      </button>
    </div>
  {% endfor %}
</div>
