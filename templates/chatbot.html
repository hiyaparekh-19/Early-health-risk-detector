{% extends "base.html" %}
{% block content %}

<div class="container py-4">

  <div class="hp-card" style="max-width: 850px; margin:auto; border-radius:18px; overflow:hidden;">
    
    <!-- Header -->
    <div style="
        background: linear-gradient(135deg, #6a5cff, #8f7bff);
        color:white;
        padding:18px 22px;
        display:flex;
        justify-content:space-between;
        align-items:center;">
        
        <div style="font-size:20px; font-weight:600;">
            🤖 AI Health Risk Assistant
        </div>

        <a href="/dashboard" class="btn btn-light btn-sm" style="border-radius:10px;">
            ✖ Close
        </a>
    </div>

    <!-- Chat Area -->
    <div id="chatBox" style="
        height:420px;
        overflow-y:auto;
        padding:20px;
        background:#f6f7fb;">
        
        <div class="bot-msg">
            Hello! I am your AI Health Assistant.  
            Ask me why your risk is high or how to prevent it.
        </div>
    </div>

    <!-- Input -->
    <div style="
        display:flex;
        border-top:1px solid #eee;
        background:white;">
        
        <input 
            type="text" 
            id="userInput" 
            placeholder="Ask about your health risk..."
            style="
                flex:1;
                border:none;
                padding:16px;
                font-size:15px;
                outline:none;
                border-radius:0 0 0 18px;">
        
        <button onclick="sendMessage()" 
            style="
                background:linear-gradient(135deg,#6a5cff,#8f7bff);
                color:white;
                border:none;
                padding:0 26px;
                font-weight:600;
                border-radius:0 0 18px 0;">
            Send
        </button>
    </div>

  </div>
</div>

<style>
.user-msg {
    background:#6a5cff;
    color:white;
    padding:12px 16px;
    border-radius:12px;
    max-width:70%;
    margin-left:auto;
    margin-bottom:10px;
}

.bot-msg {
    background:#e9ecff;
    padding:12px 16px;
    border-radius:12px;
    max-width:70%;
    margin-bottom:10px;
}
</style>

<script>
async function sendMessage() {
    const input = document.getElementById("userInput");
    const chatBox = document.getElementById("chatBox");

    const message = input.value.trim();
    if (!message) return;

    input.value = "";

    // 🔥 LOADING
    const loading = document.createElement("div");
    loading.className = "bot-msg";
    loading.innerText = "Typing...";
    chatBox.appendChild(loading);

    chatBox.scrollTop = chatBox.scrollHeight;

    const res = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ message })
    });

    const data = await res.json();

    loading.remove();

    // 🔥 CLEAR CHAT
    chatBox.innerHTML = "";

    // 🔥 RENDER FULL HISTORY
    data.history.forEach(msg => {

        // ❌ skip system message
        if (msg.role === "system") return;

        // ❌ skip hidden AI prompt
        if (msg.content.includes("User Health Data")) return;

        const div = document.createElement("div");

        div.className = msg.role === "user" ? "user-msg" : "bot-msg";

        div.innerText = msg.content;

        chatBox.appendChild(div);
    });

    chatBox.scrollTop = chatBox.scrollHeight;
}

// ENTER key support
document.getElementById("userInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        sendMessage();
    }
});
</script>

{% endblock %}
