{% extends "base.html" %}
{% block content %}

<div class="container py-4">

  <div class="hp-card" style="max-width: 850px; margin:auto; border-radius:18px; overflow:hidden;">
    
    <!-- Header -->
    <div style="
        background: linear-gradient(135deg, #6a5cff, #8f7bff);
        color:white;
        padding:18px 22px;
        display:flex;
        justify-content:space-between;
        align-items:center;">
        
        <div style="font-size:20px; font-weight:600;">
            🤖 AI Health Risk Assistant
        </div>

        <!-- CANCEL / CLOSE BUTTON -->
        <a href="/dashboard" class="btn btn-light btn-sm" style="border-radius:10px;">
            ✖ Close
        </a>
    </div>

    <!-- Chat Area -->
    <div id="chatBox" style="
        height:420px;
        overflow-y:auto;
        padding:20px;
        background:#f6f7fb;">
        
        <div style="
            background:#e9ecff;
            padding:12px 16px;
            border-radius:12px;
            max-width:70%;
            margin-bottom:10px;">
            Hello! I am your AI Health Assistant.  
            Ask me why your risk is high or how to prevent it.
        </div>
    </div>

    <!-- Input Area -->
    <div style="
        display:flex;
        border-top:1px solid #eee;
        background:white;">
        
        <input 
            type="text" 
            id="userInput" 
            placeholder="Ask about your health risk..."
            style="
                flex:1;
                border:none;
                padding:16px;
                font-size:15px;
                outline:none;
                border-radius:0 0 0 18px;">
        
        <button onclick="sendMessage()" 
            style="
                background:linear-gradient(135deg,#6a5cff,#8f7bff);
                color:white;
                border:none;
                padding:0 26px;
                font-weight:600;
                border-radius:0 0 18px 0;">
            Send
        </button>
    </div>

  </div>
</div>

<script>
function sendMessage() {
    let input = document.getElementById("userInput");
    let message = input.value.trim();
    if (!message) return;

    let chatBox = document.getElementById("chatBox");

    // USER MESSAGE (safe)
    chatBox.innerHTML += `
        <div style="
            background:#6a5cff;
            color:white;
            padding:12px 16px;
            border-radius:12px;
            max-width:70%;
            margin-left:auto;
            margin-bottom:10px;">
            ${message.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
        </div>`;

    chatBox.scrollTop = chatBox.scrollHeight;

    // LOADING
    let loadingDiv = document.createElement("div");
    loadingDiv.innerHTML = "Typing...";
    loadingDiv.style.marginBottom = "10px";
    chatBox.appendChild(loadingDiv);

    fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: message})
    })
    .then(res => res.json())
    .then(data => {
        loadingDiv.remove();

        chatBox.innerHTML += `
            <div style="
                background:#e9ecff;
                padding:12px 16px;
                border-radius:12px;
                max-width:70%;
                margin-bottom:10px;">
                ${data.reply.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
            </div>`;

        chatBox.scrollTop = chatBox.scrollHeight;
    });

    input.value = "";
}

// ENTER KEY SUPPORT
document.getElementById("userInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        sendMessage();
    }
});
</script>

{% endblock %}
