{% extends "base.html" %}

{% block content %}

<div class="main-container">

<div class="card login-card shadow-lg">

<div class="header">
    <h2>HealthPulse</h2>
    <p>Login to your wellness dashboard</p>
</div>

<form method="POST" onsubmit="showLoader()">

<!-- EMAIL -->
<div class="input-group">
    <i class="fa fa-envelope left-icon"></i>
    <input name="email" type="email" required>
    <label>Email</label>
</div>

<!-- PASSWORD -->
<div class="input-group password-group">
    
    <i class="fa fa-lock left-icon"></i>

    <input id="password" name="password" type="password" required>
    <label>Password</label>

    <i id="eyeIcon" class="fa fa-eye right-icon" onclick="togglePassword()"></i>

</div>

<button id="loginBtn" class="btn-login">
    <span id="btnText">Login</span>
</button>

</form>

{% if error %}
<div class="error-box">
    {{ error }}
</div>
{% endif %}

<div class="bottom-text">
New user?
<a href="/register">Create account</a>
</div>

</div>

</div>

<!-- 🔥 STYLES -->
<style>

.main-container{
min-height:90vh;
display:flex;
align-items:center;
justify-content:center;
background: linear-gradient(135deg,#f5f7ff,#eef1ff);
}

/* LEFT ICON */
.left-icon{
position:absolute;
left:12px;
top:50%;
transform:translateY(-50%);
color:#999;
}

/* RIGHT ICON */
.right-icon{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
color:#999;
cursor:pointer;
}

/* INPUT FIX */
.password-group input{
padding:12px 40px 12px 40px;
}
.login-card{
max-width:420px;
width:100%;
border-radius:20px;
padding:35px;
border:none;
animation: fadeIn 0.6s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

.header{
text-align:center;
margin-bottom:25px;
}
.header h2{
color:#6c63ff;
font-weight:700;
}
.header p{
color:#666;
}

.input-group{
position:relative;
margin-bottom:22px;
}

.input-group input{
width:100%;
padding:12px 45px 12px 40px;
border-radius:10px;
border:1px solid #ddd;
outline:none;
transition:0.3s;
box-sizing:border-box;
}

.input-group input:focus{
border-color:#6c63ff;
box-shadow:0 0 0 3px rgba(108,99,255,0.1);
}

.input-group label{
position:absolute;
left:40px;
top:50%;
transform:translateY(-50%);
color:#999;
font-size:14px;
transition:0.3s;
pointer-events:none;
background:white;
}

.input-group input:focus + label,
.input-group input:valid + label{
top:-8px;
left:30px;
font-size:12px;
padding:0 5px;
color:#6c63ff;
}

/* 🔥 PASSWORD FIX */
.password-group .toggle{
position:absolute;
right:12px;
top:0;
height:100%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
color:#999;
}

/* Button */
.btn-login{
width:100%;
background:linear-gradient(135deg,#6c63ff,#7c73ff);
color:white;
border:none;
border-radius:10px;
padding:12px;
font-weight:600;
transition:0.3s;
}

.btn-login:hover{
transform:scale(1.02);
}

.error-box{
margin-top:15px;
background:#fff1f0;
border:1px solid #ffa39e;
color:#ff4d4f;
padding:10px;
border-radius:10px;
text-align:center;
}

.bottom-text{
text-align:center;
margin-top:20px;
}

.bottom-text a{
color:#6c63ff;
font-weight:600;
text-decoration:none;
}

</style>

<!-- 🔥 SCRIPTS -->
<script>

function togglePassword(){
const pwd = document.getElementById("password");
const icon = document.getElementById("eyeIcon");

if(pwd.type === "password"){
    pwd.type = "text";
    icon.classList.remove("fa-eye");
    icon.classList.add("fa-eye-slash");
}else{
    pwd.type = "password";
    icon.classList.remove("fa-eye-slash");
    icon.classList.add("fa-eye");
}
}

function showLoader(){
const btn = document.getElementById("loginBtn");
const text = document.getElementById("btnText");

text.innerHTML = "Logging in...";
btn.style.opacity = "0.7";
btn.disabled = true;
}

</script>

<!-- FONT AWESOME -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

{% endblock %}
